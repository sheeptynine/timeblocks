<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>TimeBlocks</title>
<meta name="theme-color" content="#EDEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TimeBlocks">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Lora:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --fg:#1B1E26; --muted:#6A7080; --line:#D5D9E0;
  --accent:#34428C; --accent-fg:#FFFFFF; --sel:#34428C; --empty:#F6F7F9; --warn:#A33A1D;
  --display:"Lora",Georgia,serif; --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14161B; --surface:#1D2028; --fg:#E7E9EE; --muted:#9097A6; --line:#2E323C;
  --accent:#8E9BE6; --accent-fg:#14161B; --sel:#AEB8F2; --empty:#22252E; --warn:#F08A6A; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);min-height:100%}
.notice input{width:100%}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
/* iPhone search mode: the panel jumps to the top of the screen, search box first, results under it */
body.searching .sheet{top:0;bottom:auto;transform:translateY(var(--vvtop,0px));border-top:0;border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
body.searching .sheet .in{padding-top:10px}
body.searching #search{order:-1}
body.searching .top{order:-2}
body.searching #recentWrap{order:0}
body.searching .picker{order:1;max-height:max(120px,calc(var(--vvh,100vh) - 190px - env(safe-area-inset-top,0px)))}
body.searching #hint{display:none}
.range{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
/* while typing on iPhone: keep only the title in the header to leave room */
body.kb header .daynav,body.kb header .meter{display:none}
body.kb #recentWrap{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 240px}
.wrap.picking{padding-bottom:var(--padh,100vh)}
header{position:sticky;top:0;z-index:5;transform:translateY(var(--vvtop,0px));margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand h1{margin:0;font-family:var(--display);font-style:italic;font-weight:500;font-size:22px}
.status{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.status.err{color:var(--warn)}
.brand .right{display:flex;align-items:center;gap:8px}
.savebtn{height:32px;padding:0 12px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-fg);font:600 13px var(--body);cursor:pointer;white-space:nowrap}
.savebtn:disabled{opacity:.6}
.cell.pending{box-shadow:inset 0 0 0 2px var(--fg);}
.cell.pending::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--fg);opacity:.8}
.cell{position:relative}
.daynav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.arrow{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:20px;cursor:pointer}
.arrow:disabled{opacity:.35}
.daylabel{text-align:center;display:grid;gap:2px}
.daylabel strong{font-size:17px;font-weight:600}
.daylabel button{justify-self:center;border:0;background:none;color:var(--accent);font:500 12px var(--body);cursor:pointer;padding:2px 6px}
.meter{display:grid;gap:6px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--empty);border:1px solid var(--line)}
.bar span{display:block;height:100%}
.nums{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nums b{color:var(--fg);font-weight:500}
.notice{margin-top:14px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;gap:10px}
.notice p{margin:0}
.grid{display:grid;gap:4px;margin-top:12px}
.row{display:grid;grid-template-columns:40px 1fr 1fr;gap:4px}
.hr{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:8px}
.cell{min-height:46px;border-radius:8px;border:1px solid var(--line);background:var(--empty);color:var(--muted);text-align:left;padding:6px 8px;font:500 12px/1.25 var(--body);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:2px}
.cell .t{font-family:var(--mono);font-size:10px;opacity:.7}
.cell .a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.filled{border-color:transparent}
.cell.unknown{border:1px dashed var(--warn);color:var(--warn);background:var(--surface)}
.cell.sel{outline:3px solid var(--sel);outline-offset:-3px}
.cell.anchor{outline-style:dashed}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .in{max-width:560px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.count{font-weight:600}
.count small{font-family:var(--mono);font-weight:400;color:var(--muted);margin-left:6px}
.tools{display:flex;gap:6px}
.btn{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 13px var(--body);cursor:pointer}
.btn.on,.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.picker{max-height:max(100px,min(calc(var(--vvh,100vh)*.42 - 180px),300px));overflow-y:auto;display:grid;gap:12px}
.cat{display:grid;gap:6px}
.cat h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:999px;padding:8px 12px;font:500 13px var(--body);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 12px;font:16px var(--body)}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.nomatch{margin:0;font-size:13px;color:var(--muted)}
.sheet .in,.picker,.cat{grid-template-columns:minmax(0,1fr)}
.sheet .in>*{min-width:0}
.recent{display:flex;gap:6px;overflow-x:auto;max-width:100%}
.recent .chip{flex:0 0 auto}
.hint{font-size:12px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:30;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>TimeBlocks</h1><span class="right"><span class="status" id="status">Loading your sheet…</span><button class="savebtn" id="saveBtn" hidden>Save</button></span></div>
    <div class="daynav">
      <button class="arrow" id="prev" aria-label="Previous day">‹</button>
      <div class="daylabel"><strong id="dayname">—</strong><button id="today" hidden>Jump to today</button></div>
      <button class="arrow" id="next" aria-label="Next day">›</button>
    </div>
    <div class="meter"><div class="bar" id="bar"></div><div class="nums"><span>Sleep <b id="sleep">0.0</b> h</span><span id="blocks">0 of 48 blocks</span><span>Time left <b id="left">24.0</b> h</span></div></div>
  </header>
  <div id="notice" class="notice" hidden></div>
  <div class="grid" id="grid"></div>
</div>
<div class="sheet"><div class="in">
  <div class="top">
    <span class="count" id="selcount">Tap blocks to select them</span>
    <div class="tools">
      <button class="btn" id="untilBtn" title="Select the empty blocks just before now">Until now</button>
      <button class="btn" id="rangeBtn" title="Switch between range and single-block selection">Range</button>
      <button class="btn danger" id="clearBtn" hidden>Clear</button>
      <button class="btn" id="doneBtn" hidden>Cancel</button>
    </div>
  </div>
  <div id="recentWrap" hidden><div class="recent" id="recent"></div></div>
  <div class="picker" id="picker" hidden></div>
  <input class="search" id="search" type="search" placeholder="Search activities or categories" autocomplete="off" enterkeyhint="done" hidden>
  <p class="hint" id="hint" hidden>Tap the first and last block to select everything between. Switch to Single to pick blocks one by one.</p>
</div></div>
<div class="toast" id="toast" hidden></div>

<script>
const $=id=>document.getElementById(id);
let start=null,palette=[],lookup=new Map(),day=null,cells=Array(48).fill(""),prevCells=Array(48).fill(""),selected=new Set(),rangeMode=true,anchor=null,busy=false,saving=false;
const EMPTY=()=>Array(48).fill("");
// serverDays: last known copy of each day from the sheet (cached on the device for instant start)
// pending: edits not yet saved, {date:{slot:value}} — also kept on the device so nothing is lost
let serverDays={},pending={};

const CONN_KEY="tb-conn";let conn=null;
function readConn(){const h=new URLSearchParams(location.hash.slice(1));if(h.get("api")&&h.get("key")){conn={api:h.get("api"),key:h.get("key")};save(CONN_KEY,conn)}else conn=load(CONN_KEY,null)}
async function gs(fn,...args){
  if(!conn)throw new Error("Not connected");
  const r=await fetch(conn.api,{method:"POST",body:JSON.stringify({key:conn.key,fn:fn,args:args})});
  if(!r.ok)throw new Error("Server replied "+r.status);
  let j;try{j=await r.json()}catch(e){throw new Error("Unexpected reply. Check the API link.")}
  if(!j.ok)throw new Error(j.error||"Unknown error");
  return j.data;
}
function showSetup(msg){
  const n=$("notice");n.innerHTML="";
  const t=document.createElement("p");t.innerHTML="<b>Connect to your sheet</b>";
  const m=document.createElement("p");m.className="hint";m.textContent=msg||"Paste the API link and key from Apps Script. You only need to do this once on each device.";
  const a=document.createElement("input");a.className="search";a.placeholder="API link (ends in /exec)";a.value=conn?conn.api:"";
  const k=document.createElement("input");k.className="search";k.placeholder="Key";k.value=conn?conn.key:"";
  const b=document.createElement("button");b.className="btn primary";b.textContent="Connect";
  b.onclick=()=>{const av=a.value.trim(),kv=k.value.trim();if(!av||!kv)return;conn={api:av,key:kv};save(CONN_KEY,conn);n.hidden=true;boot()};
  n.append(t,m,a,k,b);n.hidden=false;setStatus("Not connected",true);
}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseIso(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function todayDate(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function diffDays(a,b){return Math.round((b-a)/86400000)}
function textOn(h){const n=parseInt(h.slice(1),16),c=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});const L=.2126*c[0]+.7152*c[1]+.0722*c[2];return (1.05/(L+.05))>=4.5?"#FFFFFF":"#1B1E26"}
function load(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,1800)}
function setStatus(m,err){$("status").textContent=m;$("status").classList.toggle("err",!!err)}
function showError(err,retry){const n=$("notice");n.innerHTML="";const p=document.createElement("p");p.textContent="Couldn't reach the sheet: "+((err&&err.message)||err);n.appendChild(p);if(retry){const b=document.createElement("button");b.className="btn primary";b.textContent="Try again";b.onclick=()=>{n.hidden=true;retry()};n.appendChild(b)}const c=document.createElement("button");c.className="btn";c.textContent="Change connection";c.onclick=()=>showSetup();n.appendChild(c);n.hidden=false;setStatus("Error",true)}
function setPalette(p){palette=p;lookup=new Map();p.forEach(c=>c.items.forEach(it=>lookup.set(it.name.toLowerCase(),{...it,cat:c.name})))}
function synced(){if(!document.getElementById("status"))return;setStatus("Synced "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}))}

function shift(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function inRange(d){return start&&diffDays(start,d)>=0&&diffDays(start,d)<=365}
function view(ds){const base=(serverDays[ds]||EMPTY()).slice(),p=pending[ds]||{};for(const k in p)base[k]=p[k];return base}
function refreshCells(){cells=view(iso(day));const pd=shift(day,-1);prevCells=inRange(pd)?view(iso(pd)):EMPTY()}
function persist(){
  const keep={};[-3,-2,-1,0,1].forEach(n=>{const k=iso(shift(day,n));if(serverDays[k])keep[k]=serverDays[k]});
  save("tb-cache",{start:start?iso(start):null,palette:palette,days:keep});save("tb-pending",pending);
}
function pendingCount(){let n=0;for(const d in pending)n+=Object.keys(pending[d]).length;return n}
function updateSaveBtn(){const n=pendingCount(),b=$("saveBtn");b.hidden=!n;b.disabled=saving;b.textContent=saving?"Saving…":"Save "+n+(n===1?" change":" changes");$("status").hidden=!!n}
const inflight={};
function fetchDay(d){const ds=iso(d);if(!inRange(d))return Promise.resolve();if(inflight[ds])return inflight[ds];
  inflight[ds]=gs("getDay",ds).then(c=>{serverDays[ds]=c}).finally(()=>{delete inflight[ds]});return inflight[ds]}
// load the shown day and the day before (for Sleep) at the same time; prefetch neighbours quietly
async function loadDay(quiet){
  const want=iso(day);if(!quiet)setStatus("Loading…");
  await Promise.all([fetchDay(day),fetchDay(shift(day,-1)).catch(()=>{})]);
  if(iso(day)!==want)return;
  refreshCells();persist();render();synced();
  fetchDay(shift(day,-2)).catch(()=>{});fetchDay(shift(day,1)).catch(()=>{});
}
async function boot(){
  if(!conn){showSetup();return}
  const c=load("tb-cache",null);pending=load("tb-pending",{})||{};
  if(c&&c.start&&c.palette){start=parseIso(c.start);setPalette(c.palette);serverDays=c.days||{};refreshCells();render();setStatus("Updating…")}
  try{
    const prevP=gs("getDay",iso(shift(day,-1))).catch(()=>null);
    const r=await gs("getInitial",iso(day));start=parseIso(r.start);setPalette(r.palette);
    if(!inRange(day)){day=new Date(start);await fetchDay(day)}else serverDays[iso(day)]=r.cells;
    const pv=await prevP;if(pv&&inRange(shift(day,-1)))serverDays[iso(shift(day,-1))]=pv;
    refreshCells();persist();render();synced();
    fetchDay(shift(day,-2)).catch(()=>{});
  }catch(e){if(c&&c.start)setStatus("Offline – showing saved copy",true);else showError(e,boot)}
}
// edits only change the screen; Save sends them to the sheet
function write(slots,value){
  const ds=iso(day),p=pending[ds]||(pending[ds]={}),srv=serverDays[ds]||EMPTY();
  slots.forEach(i=>{if((srv[i]||"")===value)delete p[i];else p[i]=value});
  if(!Object.keys(p).length)delete pending[ds];
  selected.clear();anchor=null;refreshCells();persist();render();
}
async function saveAll(){
  if(saving||!pendingCount())return;saving=true;updateSaveBtn();
  const snap=JSON.parse(JSON.stringify(pending));
  try{
    await Promise.all(Object.keys(snap).map(async ds=>{
      const ch=snap[ds],groups={};for(const k in ch)(groups[ch[k]]=groups[ch[k]]||[]).push(Number(k));
      let fresh=null;
      try{fresh=await gs("saveDay",ds,ch)}
      catch(e){if(!/Unknown request/.test(e.message))throw e;
        for(const v in groups)fresh=await gs("saveSlots",ds,groups[v],v)}
      if(fresh)serverDays[ds]=fresh;
      const p=pending[ds];if(p){for(const k in ch)if(p[k]===ch[k])delete p[k];if(!Object.keys(p).length)delete pending[ds]}
    }));
    toast("Saved to your sheet");synced();
  }catch(e){showError(e,saveAll)}
  finally{saving=false;refreshCells();persist();render()}
}
function render(){
  const t=todayDate();
  $("dayname").textContent=day.toLocaleDateString([], {weekday:"short",day:"numeric",month:"short"});
  $("today").hidden=iso(day)===iso(t);
  $("prev").disabled=!start||diffDays(start,day)<=0;$("next").disabled=!start||diffDays(start,day)>=365;
  const filled=cells.filter(Boolean).length;const isSleep=v=>String(v).trim().toLowerCase()==="sleep";const sl=cells.slice(0,24).filter(isSleep).length+prevCells.slice(24).filter(isSleep).length;$("sleep").textContent=(sl/2).toFixed(1);$("left").textContent=((48-filled)/2).toFixed(1);$("blocks").textContent=filled+" of 48 blocks";
  const bar=$("bar");bar.innerHTML="";const tally=new Map();cells.forEach(c=>{if(!c)return;const k=(lookup.get(c.toLowerCase())||{}).color||"var(--warn)";tally.set(k,(tally.get(k)||0)+1)});
  tally.forEach((n,col)=>{const s=document.createElement("span");s.style.width=(n/48*100)+"%";s.style.background=col;bar.appendChild(s)});
  const g=$("grid");g.innerHTML="";const now=new Date();const nowSlot=iso(day)===iso(t)?now.getHours()*2+(now.getMinutes()>=30?1:0):-1;
  for(let h=0;h<24;h++){
    const row=document.createElement("div");row.className="row";
    const lab=document.createElement("div");lab.className="hr";lab.textContent=String(h).padStart(2,"0");row.appendChild(lab);
    for(let k=0;k<2;k++){
      const i=h*2+k,b=document.createElement("button");b.className="cell";
      const v=cells[i],info=v?lookup.get(v.toLowerCase()):null;
      const tt=document.createElement("span");tt.className="t";tt.textContent=String(h).padStart(2,"0")+":"+(k?"30":"00");
      const a=document.createElement("span");a.className="a";a.textContent=v||(i===nowSlot?"Now":"");
      if(v&&info){b.classList.add("filled");b.style.background=info.color;b.style.color=textOn(info.color)}else if(v){b.classList.add("unknown")}
      if(pending[iso(day)]&&(i in pending[iso(day)]))b.classList.add("pending");
      if(selected.has(i))b.classList.add("sel");if(anchor===i)b.classList.add("anchor");
      b.append(tt,a);b.onclick=()=>tap(i);row.appendChild(b);
    }
    g.appendChild(row);
  }
  renderSheet();updateSaveBtn();
}
function tap(i){
  if(busy)return;
  const had=selected.size>0;
  if(rangeMode&&anchor!==null&&anchor!==i){const a=Math.min(anchor,i),b=Math.max(anchor,i);for(let k=a;k<=b;k++)selected.add(k);anchor=null}
  else if(rangeMode&&anchor===i){selected.delete(i);anchor=null}
  else if(rangeMode){selected.add(i);anchor=i}
  else selected.has(i)?selected.delete(i):selected.add(i);
  const first=!had&&selected.size>0;
  render();
  if(first)bringToTop(i);
  focusSearch();
}
// On computers (mouse/trackpad), put the cursor in the search box so you can type right away.
const desktop=window.matchMedia&&matchMedia("(hover: hover) and (pointer: fine)").matches;
function focusSearch(){if(desktop&&selected.size)setTimeout(()=>{try{$("search").focus({preventScroll:true})}catch(e){}},0)}
// Scroll so block i (the Now block) is the last row visible above the bottom panel,
// without hiding the first selected block if the whole range fits.
function showRecent(i,first,instant){
  lastView=()=>showRecent(i,first,true);
  const rows=$("grid").children,row=rows[Math.floor(i/2)];if(!row)return;
  const head=document.querySelector("header").getBoundingClientRect().bottom;
  const panel=document.querySelector(".sheet").getBoundingClientRect().top;
  let y=row.getBoundingClientRect().bottom+window.scrollY-panel+8;
  const firstRow=rows[Math.floor(first/2)];
  if(firstRow){const yFirst=firstRow.getBoundingClientRect().top+window.scrollY-head-8;if(yFirst>y)y=yFirst}
  window.scrollTo({top:Math.max(0,y),behavior:instant?"auto":"smooth"});
}
let lastView=null;
function bringToTop(i,instant){
  lastView=()=>bringToTop(i,true);
  const row=$("grid").children[Math.floor(i/2)];if(!row)return;
  const head=document.querySelector("header").getBoundingClientRect().bottom;
  const off=window.visualViewport?visualViewport.offsetTop:0;
  const y=row.getBoundingClientRect().top+window.scrollY-Math.max(head,off)-8;
  window.scrollTo({top:Math.max(0,y),behavior:instant?"auto":"smooth"});
}
// keep the selected blocks in view when the keyboard opens/closes
let reTimer=null;
function reanchor(){clearTimeout(reTimer);reTimer=setTimeout(()=>{if(selected.size)(lastView||(()=>bringToTop(Math.min(...selected),true)))()},280)}
function chip(it,fn){const b=document.createElement("button");b.className="chip";b.textContent=it.name;b.style.background=it.color;b.style.color=textOn(it.color);b.onclick=fn;return b}
function assign(name){$("search").value="";const rec=load("mm-recent",[]).filter(n=>n!==name);rec.unshift(name);save("mm-recent",rec.slice(0,8));write([...selected],name)}
function renderSheet(){
  const n=selected.size,c=$("selcount");document.querySelector(".wrap").classList.toggle("picking",n>0);c.innerHTML="";
  if(n){c.textContent=n+(n===1?" block":" blocks");const s=document.createElement("small");s.textContent=(n/2).toFixed(1)+" h";c.appendChild(s);if(document.body.classList.contains("searching")){const sl=[...selected].sort((a,b)=>a-b),f=x=>String(Math.floor(x/2)).padStart(2,"0")+":"+(x%2?"30":"00"),rg=document.createElement("span");rg.className="range";rg.textContent=f(sl[0])+"\u2013"+f(sl[sl.length-1]+1);c.appendChild(rg)}}else c.textContent=rangeMode?"Tap the first block":"Tap blocks to select them";
  $("clearBtn").hidden=!n||![...selected].some(i=>cells[i]);$("doneBtn").hidden=!n;$("untilBtn").hidden=!start||diffDays(todayDate(),day)>0;$("rangeBtn").textContent=rangeMode?"Range":"Single";$("hint").hidden=!rangeMode||n>0;
  $("search").hidden=!n;if(!n){$("search").value="";if(document.body.classList.contains("searching")){document.body.classList.remove("searching");try{$("search").blur()}catch(e){}}}
  $("picker").hidden=!n;$("recentWrap").hidden=true;if(!n)return;
  renderPicker();
}
function matches(){
  const q=$("search").value.trim().toLowerCase();
  return palette.map(cat=>({name:cat.name,items:q?cat.items.filter(it=>it.name.toLowerCase().includes(q)||cat.name.toLowerCase().includes(q)):cat.items})).filter(c=>c.items.length);
}
function renderPicker(){
  const q=$("search").value.trim(),pk=$("picker"),rw=$("recentWrap"),rc=$("recent");pk.innerHTML="";rc.innerHTML="";rw.hidden=true;
  if(!q){const recent=load("mm-recent",[]).map(x=>lookup.get(x.toLowerCase())).filter(Boolean);
    if(recent.length){recent.forEach(it=>rc.appendChild(chip(it,()=>assign(it.name))));rw.hidden=false}}
  const list=matches();
  if(!list.length){const p=document.createElement("p");p.className="nomatch";p.textContent="No activity matches \u201c"+q+"\u201d. Add it to the Palette sheet, then reopen the app.";pk.appendChild(p);return}
  list.forEach(cat=>{const d=document.createElement("div");d.className="cat";const h=document.createElement("h3");h.textContent=cat.name;const cc=document.createElement("div");cc.className="chips";cat.items.forEach(it=>cc.appendChild(chip(it,()=>assign(it.name))));d.append(h,cc);pk.appendChild(d)});
}
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
let searchOffT=null;
function searchMode(on){if(!IOS)return;clearTimeout(searchOffT);
  if(on){if(!document.body.classList.contains("searching")){document.body.classList.add("searching");renderSheet()}}
  else searchOffT=setTimeout(()=>{document.body.classList.remove("searching");renderSheet();reanchor()},250)}
// switch before the keyboard opens so iOS doesn't slide the page
$("search").addEventListener("touchstart",e=>{if(!IOS||document.body.classList.contains("searching"))return;e.preventDefault();searchMode(true);$("search").focus()},{passive:false});
$("search").addEventListener("focus",()=>searchMode(true));
$("search").addEventListener("blur",()=>searchMode(false));
$("search").addEventListener("input",renderPicker);
$("search").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const m=matches();if(m.length&&$("search").value.trim())assign(m[0].items[0].name)}});
function untilNow(){
  if(busy)return;const t=todayDate(),dd=diffDays(t,day);if(dd>0)return;
  const n=new Date(),end=dd<0?47:n.getHours()*2+(n.getMinutes()>=30?1:0)-1;
  let st;
  if(selected.size){st=Math.min(...selected);if(st>end){toast("Pick a block before now first");return}}
  else{if(end<0||cells[end]){toast("No empty blocks right before now. Tap a start block first.");return}
    st=end;while(st>0&&!cells[st-1])st--}
  selected.clear();anchor=null;for(let k=st;k<=end;k++)selected.add(k);render();showRecent(Math.min(end+1,47),st);focusSearch();
}
$("untilBtn").onclick=untilNow;
$("rangeBtn").onclick=()=>{rangeMode=!rangeMode;anchor=null;render()};
$("doneBtn").onclick=()=>{selected.clear();anchor=null;render()};
$("clearBtn").onclick=()=>write([...selected],"");
function go(delta){if(!start)return;const d=shift(day,delta);if(!inRange(d))return;day=d;selected.clear();anchor=null;refreshCells();render();
  const cached=!!serverDays[iso(day)];loadDay(cached).catch(e=>{if(!cached)showError(e,()=>loadDay())})}
$("saveBtn").onclick=saveAll;
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);$("today").onclick=()=>go(diffDays(day,todayDate()));
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&start&&!saving&&!selected.size)loadDay(true).catch(()=>{})});
let maxH=0,kbAt=0;
// iPhone Safari slides the page up under the keyboard instead of resizing it.
// Follow the visible area: pin the header to its top and the panel to just above the keyboard.
function fitKB(){
  const vv=window.visualViewport;if(!vv)return;const st=document.documentElement.style;
  const top=Math.max(0,vv.offsetTop),kb=Math.max(0,innerHeight-vv.height-vv.offsetTop);
  st.setProperty("--vvtop",top+"px");st.setProperty("--kb",kb+"px");
  document.body.classList.toggle("kb",document.activeElement===$("search")&&(kb>40||top>40||innerHeight-vv.height>120));
}
function fitVV(){fitKB();const h=window.visualViewport?visualViewport.height:innerHeight;document.documentElement.style.setProperty("--vvh",h+"px");
  maxH=Math.max(maxH,innerHeight,h);document.documentElement.style.setProperty("--padh",maxH+"px");if(Date.now()-kbAt<1200)reanchor()}
addEventListener("orientationchange",()=>{maxH=0;setTimeout(fitVV,300)});
$("search").addEventListener("focus",()=>{kbAt=Date.now();fitKB();setTimeout(fitVV,300);setTimeout(fitVV,650);reanchor();setTimeout(reanchor,700)});
$("search").addEventListener("blur",()=>{kbAt=Date.now();document.body.classList.remove("kb");setTimeout(fitKB,350);setTimeout(reanchor,300)});
if(window.visualViewport){visualViewport.addEventListener("resize",fitVV);visualViewport.addEventListener("scroll",fitKB)}addEventListener("resize",fitVV);fitVV();
readConn();day=todayDate();render();boot();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
// ask the browser not to clear this app's saved data (connection, unsaved edits)
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
</script>
</body>
